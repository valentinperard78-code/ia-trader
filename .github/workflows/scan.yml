name: Scan des cryptos (2 ans d'historique)

on:
  schedule:
    - cron: "17 3 * * 0"   # chaque dimanche vers 4 h du matin
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ia-trader
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scanner toutes les cryptos en euros
        run: python -m bot.scan
      - name: Sauvegarder le scan
        run: |
          git config user.name "ia-trader-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/scan.json
          git diff --cached --quiet && exit 0
          git commit -m "scan: nouvelle sélection"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
